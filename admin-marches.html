<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration - Gestion des Marchés | GRNB ADVISORY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 20px; }
        .admin-card { background: #fff; padding: 24px; border-radius: 10px; max-width: 900px; margin: 0 auto 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2, h3 { color: #0f2b48; margin-top: 0; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-top: 12px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-primary { background: #0f2b48; color: #fff; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-danger { background: #dc2626; color: #fff; }
        .ind-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap: 10px; align-items: end; }
    </style>
</head>
<body>

<div class="admin-card">
    <h1>Administration : Page "Les marchés"</h1>
    <p>Sélectionnez un pays à modifier ou ajoutez un nouveau pays/zone.</p>
    
    <div style="display:flex; gap:10px; align-items:center;">
        <select id="select-pays" onchange="onPaysSelect()">
            <!-- Liste remplie dynamiquement -->
        </select>
        <button class="btn btn-secondary" onclick="creerNouveauPays()">+ Nouveau Pays</button>
    </div>
</div>

<div class="admin-card" id="form-container" style="display:none;">
    <h2 id="form-title">Édition du Pays</h2>
    
    <div style="display:grid; grid-template-columns: 1fr 3fr; gap:15px;">
        <div>
            <label>Drapeau (Émoji)</label>
            <input type="text" id="drapeau" placeholder="🇺🇸">
        </div>
        <div>
            <label>Nom du pays / zone</label>
            <input type="text" id="nom" placeholder="États-Unis">
        </div>
    </div>

    <h3>Baromètre Cyclique</h3>
    <label>Position du curseur (0 = Récession, 100 = Expansion)</label>
    <input type="range" id="position_barometre" min="0" max="100" oninput="document.getElementById('valeur-baro').innerText = this.value">
    <div>Valeur actuelle : <strong id="valeur-baro">50</strong> / 100</div>

    <label>Analyse / Interprétation de la situation cyclique</label>
    <textarea id="texte_cycle" rows="3" placeholder="L'économie fait preuve de résilience..."></textarea>

    <h3>Indicateurs Macroéconomiques</h3>
    <div id="indicators-list">
        <!-- Liste des indicateurs editable -->
    </div>
    <button class="btn btn-secondary" onclick="ajouterIndicateurChamp()" style="margin-top:10px;">+ Ajouter un indicateur</button>

    <div style="margin-top:30px; display:flex; gap:10px;">
        <button class="btn btn-primary" onclick="sauvegarder()">Enregistrer les modifications</button>
        <button class="btn btn-danger" onclick="supprimerPays()">Supprimer ce pays</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
let currentPaysList = [];
let selectedPays = null;

async function initAdmin() {
    if (typeof supabaseClient === 'undefined') {
        alert('Supabase client non configuré dans config.js');
        return;
    }
    const { data } = await supabaseClient.from('marches_pays').select('*').order('created_at', { ascending: true });
    currentPaysList = data || [];
    
    const select = document.getElementById('select-pays');
    select.innerHTML = '<option value="">-- Choisir un pays --</option>' + 
        currentPaysList.map(p => `<option value="${p.id}">${p.drapeau || ''} ${p.nom}</option>`).join('');

    if (currentPaysList.length > 0) {
        select.value = currentPaysList[0].id;
        onPaysSelect();
    }
}

function onPaysSelect() {
    const id = document.getElementById('select-pays').value;
    selectedPays = currentPaysList.find(p => p.id === id) || null;
    
    if (!selectedPays) {
        document.getElementById('form-container').style.display = 'none';
        return;
    }

    document.getElementById('form-container').style.display = 'block';
    document.getElementById('form-title').innerText = `Édition : ${selectedPays.nom}`;
    document.getElementById('drapeau').value = selectedPays.drapeau || '';
    document.getElementById('nom').value = selectedPays.nom || '';
    document.getElementById('position_barometre').value = selectedPays.position_barometre || 50;
    document.getElementById('valeur-baro').innerText = selectedPays.position_barometre || 50;
    document.getElementById('texte_cycle').value = selectedPays.texte_cycle || '';

    renderIndicateursForm(selectedPays.indicateurs || []);
}

function renderIndicateursForm(indicateurs) {
    const container = document.getElementById('indicators-list');
    container.innerHTML = indicateurs.map((ind, idx) => `
        <div class="ind-item" data-idx="${idx}">
            <div>
                <label>Nom</label>
                <input type="text" class="ind-nom" value="${ind.nom || ''}" placeholder="PIB">
            </div>
            <div>
                <label>Valeur</label>
                <input type="text" class="ind-valeur" value="${ind.valeur || ''}" placeholder="+2.5%">
            </div>
            <div>
                <label>Tendance & Couleur</label>
                <select class="ind-type">
                    <option value="green" ${ind.tendance_type === 'green' ? 'selected' : ''}>🟢 Vert (Haussier/Positif)</option>
                    <option value="orange" ${ind.tendance_type === 'orange' ? 'selected' : ''}>🟠 Orange (Neutre/Stable)</option>
                    <option value="red" ${ind.tendance_type === 'red' ? 'selected' : ''}>🔴 Rouge (Baissier/Alerte)</option>
                </select>
            </div>
            <button class="btn btn-danger" onclick="supprimerIndicateur(${idx})">X</button>
        </div>
    `).join('');
}

function ajouterIndicateurChamp() {
    const current = getIndicateursFromForm();
    current.push({ nom: 'Nouvel Indicateur', valeur: '0%', tendance_type: 'green', texte_tendance: 'Stable' });
    renderIndicateursForm(current);
}

function supprimerIndicateur(idx) {
    const current = getIndicateursFromForm();
    current.splice(idx, 1);
    renderIndicateursForm(current);
}

function getIndicateursFromForm() {
    const items = document.querySelectorAll('.ind-item');
    const result = [];
    items.forEach(item => {
        result.push({
            nom: item.querySelector('.ind-nom').value,
            valeur: item.querySelector('.ind-valeur').value,
            tendance_type: item.querySelector('.ind-type').value,
            texte_tendance: item.querySelector('.ind-type').value === 'green' ? 'Tendance favorable' : 'Point d\'attention'
        });
    });
    return result;
}

async function creerNouveauPays() {
    const nom = prompt("Nom du nouveau pays ou zone (ex: Chine, Zone Euro) :");
    if (!nom) return;

    const pays_id = nom.toLowerCase().replace(/[^a-z0-0]/g, '-');
    const newEntry = {
        pays_id,
        nom,
        drapeau: '🏳️',
        position_barometre: 50,
        texte_cycle: '',
        indicateurs: []
    };

    const { data, error } = await supabaseClient.from('marches_pays').insert([newEntry]).select();
    if (error) {
        alert('Erreur lors de la création : ' + error.message);
    } else {
        await initAdmin();
        document.getElementById('select-pays').value = data[0].id;
        onPaysSelect();
    }
}

async function sauvegarder() {
    if (!selectedPays) return;

    const updatedData = {
        drapeau: document.getElementById('drapeau').value,
        nom: document.getElementById('nom').value,
        position_barometre: parseInt(document.getElementById('position_barometre').value),
        texte_cycle: document.getElementById('texte_cycle').value,
        indicateurs: getIndicateursFromForm()
    };

    const { error } = await supabaseClient.from('marches_pays').update(updatedData).eq('id', selectedPays.id);
    if (error) {
        alert('Erreur de sauvegarde : ' + error.message);
    } else {
        alert('Modifications enregistrées avec succès !');
        await initAdmin();
    }
}

async function supprimerPays() {
    if (!selectedPays || !confirm(`Supprimer définitivement ${selectedPays.nom} ?`)) return;

    const { error } = await supabaseClient.from('marches_pays').delete().eq('id', selectedPays.id);
    if (error) {
        alert('Erreur : ' + error.message);
    } else {
        await initAdmin();
    }
}

document.addEventListener('DOMContentLoaded', initAdmin);
</script>
</body>
</html>
